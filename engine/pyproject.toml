[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["podcast_engine"]

[project]
name = "podcast-engine"
version = "0.1.0"
description = "podcast-editor の音声処理エンジン"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "scipy",
  "soundfile",
  "soxr",
  "pedalboard",  # MP3 の読み書き（LAME 内蔵。ffmpeg 不要）。フェーズ3でエフェクトにも使う
]

[project.optional-dependencies]
# ノイズ除去。DeepFilterNet は新しい torchaudio と合わないので版を固定
denoise = ["deepfilternet", "torch==2.0.1", "torchaudio==2.0.2"]
# 話者の声紋。torch は denoise と同じ版を共用（上げ下げしない）
voiceprint = ["resemblyzer", "webrtcvad-wheels", "librosa", "torch==2.0.1"]
server = ["fastapi", "uvicorn", "python-multipart"]  # 編集画面のサーバー（アップロードに python-multipart が要る）
transcribe = ["mlx-whisper"]  # Apple Silicon の Mac のみ
dev = ["pytest", "zstandard", "pyloudnorm"]  # pyloudnorm はラウドネス測定の照合テスト用

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
