[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["podcast_engine"]

[project]
name = "podcast-engine"
version = "0.1.0"
description = "podcast-editor の音声処理エンジン"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "scipy",
  "soundfile",
  "soxr",
  "pedalboard",  # MP3 の読み書き（LAME 内蔵。ffmpeg 不要）。フェーズ3でエフェクトにも使う
]

[project.optional-dependencies]
dev = ["pytest", "zstandard"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
